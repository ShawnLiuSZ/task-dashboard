name: Quality Check

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # #252：Tauri 在 Linux 上编译需要 GTK / WebKit / glib 等系统库（build script 阶段
      # 就要 pkg-config 找得到），漏装则连 `cargo clippy --lib` 都编不过。
      # 与 release.yml 共用同一份清单，避免各自维护时再次漏装。
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Run Clippy
        working-directory: app/src-tauri
        run: cargo clippy --lib -p taskboard -- -D warnings

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run ESLint
        working-directory: app
        run: npm run lint

      - name: Check formatting
        working-directory: app
        run: npm run format:check

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # #252：同 rust-clippy —— 缺系统库时 `cargo test --lib` 也会在编译阶段就失败。
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Run lib tests
        working-directory: app/src-tauri
        run: cargo test --lib

      - name: Run db tests
        working-directory: app/src-tauri
        run: cargo test --test db_test

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

  scripts-checks:
    name: Scripts Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # #284：仓库内脚本（workflow 配置校验 / PR 收尾逻辑）此前没有任何 CI 覆盖。
      - name: Workflow 配置校验
        run: python3 scripts/check-workflow-yaml.py

      - name: scripts 单测
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
