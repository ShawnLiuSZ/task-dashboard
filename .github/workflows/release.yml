name: Release

# 发布 GitHub Release（点击 Publish）时，自动在 GitHub 托管 runner 上
# 构建 macOS / Windows / Linux 三端安装包，并作为附件上传到该 Release。
#
# 用法：
#   1. 本地把 version 四处 + lockfile 统一（package.json / package-lock.json /
#      src-tauri/Cargo.toml / src-tauri/Cargo.lock / src-tauri/tauri.conf.json），
#      跑 `python3 scripts/check-versions.py` 确认（含 README 中英的当前版本引用）
#   2. 打 tag（与 version 对齐）：git tag v0.1.0 && git push origin v0.1.0
#   3. 在 GitHub 上基于该 tag 创建 Release 并 Publish → 触发本工作流
#   4. 也可在 Actions 页面手动 Run workflow 兜底（此时用当前 ref 的 tag/分支名）
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# #330：同一 tag 重复触发（重新 Publish / 手动 Run）时，两个 run 会并发往同一个
# Release 上传附件、互相覆盖产物。串行化并保留进行中的 run（cancel-in-progress:
# false —— 打包很贵，半途取消会留下不完整附件）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      # #476 后续：**串行化**（`max-parallel: 1`）。
      #
      # 起因：tauri-action v1 在**每个矩阵 job 结束时各生成一次** updater 清单
      # （`latest.json`），每次都是「下载已有清单 → 合并自己平台的条目 →
      # **删掉旧资产** → 上传新的」（见 tauri-action `src/upload-version-json.ts`）。
      # GitHub 的 release 资产**不能同名覆盖** ⇒ 必须先删 ⇒ **6 个 job 并发时互相踩**：
      # 后完成的 job 往往拿着**过期**的内容去覆盖 ⇒ 先完成平台的条目整块丢失。
      #
      # 实测 v0.7.7：macOS 两个 job 最早完成（03:53 / 03:55 上传），条目被随后完成的
      # Linux / Windows job 覆盖 ⇒ 线上清单只剩 14 个 Linux/Windows key，
      # **macOS 的 4 个全丢** ⇒ macOS 客户端报「None of the fallback platforms
      # ["darwin-aarch64-app", "darwin-aarch64"] were found」⇒ 完全无法应用内更新。
      #
      # 串行化后每个 job 都能看到前一个 job 的结果 ⇒ 最终清单必然齐全
      # （用上游自己的清单逻辑，不重复实现 ⇒ 不会与 tauri-action 漂移）。
      # 代价：发版从约 9 分钟变成约 45~50 分钟（构建本身不变，只是排队）。
      # 兜底：矩阵跑完后还有 `updater-check` job 复核线上清单，缺条目就发版变红。
      max-parallel: 1
      matrix:
        include:
          # macOS ARM (Apple Silicon)
          - platform: macos-latest
            bundles: app,dmg
            target: aarch64-apple-darwin
          # macOS x64 (Intel) — 在 Apple Silicon runner 上交叉编译（macos-13 runner 资源紧张易排队）
          - platform: macos-latest
            bundles: app,dmg
            target: x86_64-apple-darwin
          # Windows x64
          - platform: windows-latest
            bundles: nsis,msi
            target: x86_64-pc-windows-msvc
          # Windows ARM64
          - platform: windows-11-arm
            bundles: nsis,msi
            target: aarch64-pc-windows-msvc
          # Linux amd64
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
            target: x86_64-unknown-linux-gnu
          # Linux arm64
          - platform: ubuntu-22.04-arm
            bundles: deb,rpm,appimage
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    # #330：此前 6 个平台 job 都没有超时，卡死时按 GitHub 默认 **6 小时**计费。
    # 打包正常 10~20 分钟，60 分钟足够覆盖冷缓存 + 排队。
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # #231：导入固定的代码签名证书。
      #
      # 目的：让每个版本的 designated requirement（DR）保持恒定。ad-hoc 签名（`-`）的 DR
      # 直接绑定 cdhash，每次构建都变，macOS 会把新版本当成全新应用 —— 这正是「每次更新
      # 都要去隐私与安全性点『仍要打开』」的根因。换成固定证书后 DR 形如
      # `identifier + 证书锚点`，跨版本不变，用户只需首次安装放行一次。
      #
      # 未配置 APPLE_CERTIFICATE 时跳过，构建退回 ad-hoc：不阻断 CI，但体验退化。
      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE 未配置，本次构建使用 ad-hoc 签名"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # 必须设为 default-keychain，否则 codesign 找不到该 identity
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12
          # 证书 CN 固定，见 docs/issue-231-macos-gatekeeper-update.md 的生成步骤
          echo "APPLE_SIGNING_IDENTITY=TaskBoard Local Signing" >> "$GITHUB_ENV"

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # #231：updater 产物的 minisign 签名私钥（与 Apple 证书无关）。
          # 缺失时构建会失败 —— bundle.createUpdaterArtifacts 已开启，签名不可禁用。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.event.release.tag_name || github.ref_name }}
          releaseName: "TaskBoard v__VERSION__"
          releaseBody: "See the assets below to download and install TaskBoard."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  # #476 后续：updater 清单完整性门禁。
  #
  # 清单缺当前平台的 key ⇒ 客户端「检查更新」直接失败（macOS 在 v0.7.7 实测踩过：
  # 清单里一个 darwin 条目都没有）。这里在矩阵全部结束后复核**线上**清单：
  # 缺平台条目就**让本次发版变红**，而不是静默发一个装不了更新的版本。
  #
  # 断言清单里每个平台（darwin / windows / linux × x86_64 / aarch64）的
  # primary key 与各 bundle 变体都在 —— 与 `scripts/check-updater-manifest.py`
  # 里的 `PLATFORM_BUNDLES` 一一对应。
  updater-check:
    name: Updater Manifest Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 校验 updater 清单的平台完整性
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/check-updater-manifest.py
          --tag "${{ github.event.release.tag_name || github.ref_name }}"
