name: Release

# 发布 GitHub Release（点击 Publish）时，自动在 GitHub 托管 runner 上
# 构建 macOS / Windows / Linux 三端安装包，并作为附件上传到该 Release。
#
# 用法：
#   1. 本地把 tauri.conf.json / Cargo.toml / package.json 的 version 统一（如 0.1.0）
#   2. 打 tag（与 version 对齐）：git tag v0.1.0 && git push origin v0.1.0
#   3. 在 GitHub 上基于该 tag 创建 Release 并 Publish → 触发本工作流
#   4. 也可在 Actions 页面手动 Run workflow 兜底（此时用当前 ref 的 tag/分支名）
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM (Apple Silicon)
          - platform: macos-latest
            bundles: app,dmg,zip
            target: aarch64-apple-darwin
          # macOS x64 (Intel)
          - platform: macos-13
            bundles: app,dmg,zip
            target: x86_64-apple-darwin
          # Windows x64
          - platform: windows-latest
            bundles: nsis,msi,zip
            target: x86_64-pc-windows-msvc
          # Windows ARM64
          - platform: windows-11-arm
            bundles: nsis,msi,zip
            target: aarch64-pc-windows-msvc
          # Linux amd64
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
            target: x86_64-unknown-linux-gnu
          # Linux arm64
          - platform: ubuntu-22.04-arm
            bundles: deb,rpm,appimage
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            rpm

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.event.release.tag_name || github.ref_name }}
          releaseName: "TaskBoard v__VERSION__"
          releaseBody: "See the assets below to download and install TaskBoard."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
