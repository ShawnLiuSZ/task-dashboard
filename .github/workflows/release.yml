name: Release

# 发布 GitHub Release（点击 Publish）时，自动在 GitHub 托管 runner 上
# 构建 macOS / Windows / Linux 三端安装包，并作为附件上传到该 Release。
#
# 用法：
#   1. 本地把 tauri.conf.json / Cargo.toml / package.json 的 version 统一（如 0.1.0）
#   2. 打 tag（与 version 对齐）：git tag v0.1.0 && git push origin v0.1.0
#   3. 在 GitHub 上基于该 tag 创建 Release 并 Publish → 触发本工作流
#   4. 也可在 Actions 页面手动 Run workflow 兜底（此时用当前 ref 的 tag/分支名）
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM (Apple Silicon)
          - platform: macos-latest
            bundles: app,dmg
            target: aarch64-apple-darwin
          # macOS x64 (Intel) — 在 Apple Silicon runner 上交叉编译（macos-13 runner 资源紧张易排队）
          - platform: macos-latest
            bundles: app,dmg
            target: x86_64-apple-darwin
          # Windows x64
          - platform: windows-latest
            bundles: nsis,msi
            target: x86_64-pc-windows-msvc
          # Windows ARM64
          - platform: windows-11-arm
            bundles: nsis,msi
            target: aarch64-pc-windows-msvc
          # Linux amd64
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
            target: x86_64-unknown-linux-gnu
          # Linux arm64
          - platform: ubuntu-22.04-arm
            bundles: deb,rpm,appimage
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            rpm

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # #231：导入固定的代码签名证书。
      #
      # 目的：让每个版本的 designated requirement（DR）保持恒定。ad-hoc 签名（`-`）的 DR
      # 直接绑定 cdhash，每次构建都变，macOS 会把新版本当成全新应用 —— 这正是「每次更新
      # 都要去隐私与安全性点『仍要打开』」的根因。换成固定证书后 DR 形如
      # `identifier + 证书锚点`，跨版本不变，用户只需首次安装放行一次。
      #
      # 未配置 APPLE_CERTIFICATE 时跳过，构建退回 ad-hoc：不阻断 CI，但体验退化。
      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE 未配置，本次构建使用 ad-hoc 签名"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # 必须设为 default-keychain，否则 codesign 找不到该 identity
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12
          # 证书 CN 固定，见 docs/issue-231-macos-gatekeeper-update.md 的生成步骤
          echo "APPLE_SIGNING_IDENTITY=TaskBoard Local Signing" >> "$GITHUB_ENV"

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # #231：updater 产物的 minisign 签名私钥（与 Apple 证书无关）。
          # 缺失时构建会失败 —— bundle.createUpdaterArtifacts 已开启，签名不可禁用。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.event.release.tag_name || github.ref_name }}
          releaseName: "TaskBoard v__VERSION__"
          releaseBody: "See the assets below to download and install TaskBoard."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
