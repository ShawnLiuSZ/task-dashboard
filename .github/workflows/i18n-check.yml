# i18n 一致性校验（Issue #7）：PR 与 push 到 develop / main 时检查两份 locale
# 的 key 集合、占位符与空翻译，避免未翻译/漏翻译的字符串合入主分支。
name: i18n-check

on:
  pull_request:
  push:
    branches: [main, develop]

# 最小权限（#330）：本 workflow 只读仓库跑校验脚本，不写任何东西。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: 校验 locale 文件
        run: node app/scripts/check-i18n.mjs
